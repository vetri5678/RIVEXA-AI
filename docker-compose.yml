version: "3.9"

# ─── Shared Networks ───────────────────────────────────────────────────────────
networks:
  riskvision-net:
    driver: bridge

# ─── Shared Volumes ───────────────────────────────────────────────────────────
volumes:
  riskvision_model_cache:

# ─── Services ─────────────────────────────────────────────────────────────────
services:

  # ── FastAPI Backend + ML Engine ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: riskvision_api
    restart: unless-stopped
    environment:
      # Database (Supabase PostgreSQL)
      DATABASE_URL: ${DATABASE_URL}

      # JWT Secrets (override in production with secure random values)
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-64-char-secure-random-string}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}

      # Admin Bootstrap Credentials
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@riskvision.ai}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@RiskVision!2025}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-riskvision_admin}

      # App Config
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "false"
      DB_ECHO: "false"
      PORT: "8000"

    volumes:
      # Persist ML model artifacts and SQLite (dev only)
      - riskvision_model_cache:/app/data
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - riskvision-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Nginx Reverse Proxy (Production Mode) ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: riskvision_nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./stitch_riskvision_ai_intelligence_platform/dist:/usr/share/nginx/html:ro
      - ./stitch_riskvision_ai_intelligence_platform/dashboard/dist:/usr/share/nginx/html/dashboard:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - riskvision-net
    profiles:
      - production

  # ── Spring Boot Java Backend ──────────────────────────────────────────────────
  springboot-backend:
    build:
      context: ./stitch_riskvision_ai_intelligence_platform/riskvision_ai_springboot_backend
      dockerfile: Dockerfile
    container_name: riskvision_springboot
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT}/${SUPABASE_DB_NAME}?sslmode=require
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: ${SUPABASE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SUPABASE_DB_PASSWORD}
      SPRING_JPA_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      ML_SERVICE_URL: http://api:8000
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-64-char-secure-random-string}
    ports:
      - "8080:8080"
    networks:
      - riskvision-net

  # ── LLM Telemetry Helper Service ──────────────────────────────────────────────
  llm-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: riskvision_llm
    restart: unless-stopped
    command: python stitch_riskvision_ai_intelligence_platform/riskvision_ai_backend/llm_service.py
    environment:
      LLM_PORT: "5001"
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "5001:5001"
    networks:
      - riskvision-net



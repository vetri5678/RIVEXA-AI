name: RiskVision AI Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test-springboot:
    name: Build & Test Spring Boot Java Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot Backend with Maven
        run: |
          cd stitch_riskvision_ai_intelligence_platform/riskvision_ai_springboot_backend
          mvn clean test-compile

      - name: Run Spring Boot Unit & Integration Tests
        run: |
          cd stitch_riskvision_ai_intelligence_platform/riskvision_ai_springboot_backend
          mvn test

  test-python-fastapi:
    name: Test Python FastAPI ML Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: stitch_riskvision_ai_intelligence_platform/riskvision_ai_backend/requirements.txt

      - name: Install Python ML Dependencies
        run: |
          cd stitch_riskvision_ai_intelligence_platform/riskvision_ai_backend
          pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Pytest Suite
        run: |
          cd stitch_riskvision_ai_intelligence_platform/riskvision_ai_backend
          PYTHONPATH=. python -m pytest

  build-react-frontend:
    name: Verify React TypeScript Dashboard Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: stitch_riskvision_ai_intelligence_platform/dashboard/package-lock.json

      - name: Install Node Dependencies
        run: |
          cd stitch_riskvision_ai_intelligence_platform/dashboard
          npm ci

      - name: Build Dashboard Assets
        run: |
          cd stitch_riskvision_ai_intelligence_platform/dashboard
          npm run build

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001a3a"/>
      <stop offset="100%" stop-color="#000d1f"/>
    </radialGradient>
    <linearGradient id="eye-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#0055ff"/>
    </linearGradient>
    <linearGradient id="rv-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="49" fill="url(#bg-glow)"/>
  <!-- Eye outline - upper arc -->
  <path d="M 10 50 Q 50 10 90 50 Q 50 90 10 50 Z" fill="none" stroke="url(#eye-grad)" stroke-width="3" filter="url(#glow-effect)"/>
  <!-- Eye inner ring -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="url(#eye-grad)" stroke-width="2" opacity="0.6"/>
  <!-- Eye crosshair lines -->
  <line x1="15" y1="50" x2="28" y2="50" stroke="#0099ee" stroke-width="1.5" opacity="0.8"/>
  <line x1="72" y1="50" x2="85" y2="50" stroke="#0099ee" stroke-width="1.5" opacity="0.8"/>
  <!-- R+V monogram paths inside pupil -->
  <!-- R stroke -->
  <path d="M 40 42 L 40 58 M 40 42 L 48 42 Q 52 42 52 47 Q 52 52 48 52 L 40 52 M 48 52 L 52 58" fill="none" stroke="url(#rv-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-effect)"/>
  <!-- V stroke -->
  <path d="M 53 42 L 59 58 L 65 42" fill="none" stroke="url(#rv-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-effect)"/>
  <!-- Pupil dot -->
  <circle cx="50" cy="50" r="3" fill="#00d4ff" filter="url(#glow-effect)"/>
</svg>
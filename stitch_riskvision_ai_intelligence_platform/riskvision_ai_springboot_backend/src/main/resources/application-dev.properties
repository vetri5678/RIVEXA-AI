# ==============================================================================
# RiskVision AI — Spring Boot Development Profile Configuration  
# ==============================================================================
# This profile enables resilient startup for development environments
# with potentially unreliable network connections or database availability

# Development-specific logging
logging.level.ai.riskvision.graveyard=DEBUG
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.web=DEBUG

# Development Database Connection (More Resilient)
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST:aws-0-ap-northeast-1.pooler.supabase.com}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require&connectTimeout=45&socketTimeout=45&tcpKeepAlive=true&ApplicationName=RiskVision-DEV&loginTimeout=45

# More resilient Hibernate settings for development
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Skip schema validation that requires database connection
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Development-optimized HikariCP settings
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=45000
spring.datasource.hikari.validation-timeout=15000
spring.datasource.hikari.initialization-fail-timeout=120000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.leak-detection-threshold=600000
spring.datasource.hikari.test-while-idle=false
spring.datasource.hikari.test-on-borrow=false

# Allow graceful startup even if some beans fail temporarily
spring.main.allow-circular-references=true
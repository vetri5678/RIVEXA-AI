server.port=${PORT:8080}

# ─── Database (Supabase PostgreSQL) ───────────────────────────────────────────
# All credentials MUST be provided via environment variables.
# No insecure defaults are provided for sensitive values.
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST:localhost}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require&prepareThreshold=0&preferQueryMode=simple&connectTimeout=30&socketTimeout=120&tcpKeepAlive=true&ApplicationName=RiskVision-SpringBoot
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# Connection Pool Tuning (HikariCP)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=300000
spring.datasource.hikari.auto-commit=false

# ─── External Service URLs & API Keys ──────────────────────────────────────────
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
ml.api.key=${ML_API_KEY:}
llm.service.url=${LLM_SERVICE_URL:http://localhost:5001}

riskvision.report.count=${RISKVISION_REPORT_COUNT:100}

# ─── JWT Configuration ────────────────────────────────────────────────────────
# MUST be set via SECRET_KEY environment variable (64+ char secure random string).
# Generate with: openssl rand -hex 64
# Shared with FastAPI backend — must match SECRET_KEY in riskvision_ai_backend/.env
jwt.secret=${SECRET_KEY:}
jwt.expire-length=${JWT_EXPIRE_LENGTH:1800000}
jwt.refresh-expire-length=${JWT_REFRESH_EXPIRE_LENGTH:604800000}

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.web.FilterChainProxy=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.ai.riskvision.graveyard=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.transaction=TRACE
logging.level.org.springframework.orm.jpa=DEBUG

# ─── Spring Mail (JavaMailSender) Configuration ───────────────────────────────
# SMTP credentials MUST be provided via environment variables.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:admin@riskvision.ai}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ─── CORS ─────────────────────────────────────────────────────────────────────
# Restrict to specific known frontend origins. Do NOT use wildcard patterns.
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5176,http://127.0.0.1:5176,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}

# ─── Frontend Base URL ────────────────────────────────────────────────────────
# Used by OAuth2 success/failure handlers and email links to redirect to the correct frontend host.
app.frontend.url=${FRONTEND_URL:http://localhost:5176}

# ─── Admin Seed Account ──────────────────────────────────────────────────────
# The email and password for the default admin user created on first startup.
app.admin.email=${ADMIN_EMAIL:admin@riskvision.ai}
app.admin.password=${ADMIN_PASSWORD:CHANGE_ME_ON_FIRST_LOGIN}
app.admin.notification-email=${ADMIN_NOTIFICATION_EMAIL:admin@riskvision.ai}


# ─── Google OAuth2 Client Configuration ────────────────────────────────────────
# Credentials MUST be provided via environment variables.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:mock-google-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:mock-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ─── GitHub OAuth2 Client Configuration ──────────────────────────────────────
# Credentials MUST be provided via environment variables.
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:your-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:your-github-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}

# ─── GitHub Personal Access Token (PAT) Configuration ────────────────────────
# Provided via environment variables GITHUB_TOKEN or GITHUB_PAT.
github.token=${GITHUB_TOKEN:${GITHUB_PAT:}}
github.api.base-url=${GITHUB_API_BASE_URL:https://api.github.com}
github.api.connect-timeout-ms=${GITHUB_API_CONNECT_TIMEOUT_MS:5000}
github.api.read-timeout-ms=${GITHUB_API_READ_TIMEOUT_MS:10000}
github.api.max-conn-total=${GITHUB_API_MAX_CONN_TOTAL:50}
github.api.max-conn-per-route=${GITHUB_API_MAX_CONN_PER_ROUTE:20}
github.api.cache-ttl-minutes=${GITHUB_API_CACHE_TTL_MINUTES:15}

# ─── Security & Auth Configuration ────────────────────────────────────────────
app.auth.max-failed-attempts=${APP_AUTH_MAX_FAILED_ATTEMPTS:5}
app.auth.lock-duration-minutes=${APP_AUTH_LOCK_DURATION_MINUTES:15}
app.auth.verification-token-hours=${APP_AUTH_VERIFICATION_TOKEN_HOURS:24}
app.auth.reset-token-minutes=${APP_AUTH_RESET_TOKEN_MINUTES:15}

# ─── n8n Webhook Configurations ──────────────────────────────────────────────
n8n.webhook.enabled=${N8N_WEBHOOK_ENABLED:true}
n8n.webhook.connect-timeout-ms=${N8N_WEBHOOK_CONNECT_TIMEOUT_MS:2000}
n8n.webhook.read-timeout-ms=${N8N_WEBHOOK_READ_TIMEOUT_MS:3000}
n8n.webhook.max-retries=${N8N_WEBHOOK_MAX_RETRIES:2}
n8n.webhook.base-url=${N8N_WEBHOOK_BASE_URL:http://localhost:5678/webhook}
n8n.webhook.registration=${n8n.webhook.base-url}/registration-verification
n8n.webhook.login-success=${n8n.webhook.base-url}/login-success
n8n.webhook.login-failed=${n8n.webhook.base-url}/login-failed-warning
n8n.webhook.password-reset=${n8n.webhook.base-url}/password-reset
n8n.webhook.password-changed=${n8n.webhook.base-url}/password-changed
n8n.webhook.account-locked=${n8n.webhook.base-url}/account-locked
n8n.webhook.oauth-linked=${n8n.webhook.base-url}/oauth-linked
n8n.webhook.prediction-completed=${n8n.webhook.base-url}/prediction-completed
n8n.webhook.repository-sync=${n8n.webhook.base-url}/repository-sync
n8n.webhook.high-risk-detected=${n8n.webhook.base-url}/high-risk-detected
n8n.webhook.report-generated=${n8n.webhook.base-url}/report-generated
n8n.webhook.risk-threshold=${RISK_ALERT_THRESHOLD:80.0}
n8n.webhook.secret=${N8N_WEBHOOK_SECRET:rv_n8n_secret_key_2026}


# ─── Spring Boot Actuator ─────────────────────────────────────────────────────
# SECURITY: Only expose health endpoint publicly. prometheus/env/beans are protected by SecurityConfig.
management.endpoints.web.exposure.include=health,metrics,prometheus,info,httpexchanges
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoint.httpexchanges.enabled=true
# Disable sensitive endpoints entirely
management.endpoint.env.enabled=false
management.endpoint.beans.enabled=false

# ─── OpenRouter API Configuration ─────────────────────────────────────────────
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
openrouter.default-model=openrouter/free
openrouter.fallback-models=google/gemma-4-26b-a4b-it:free,openai/gpt-oss-20b:free,nvidia/nemotron-3-nano-30b-a3b:free
openrouter.timeout-seconds=30
openrouter.max-retries=3

# ─── File Upload Security ─────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
file.allowed-extensions=${FILE_ALLOWED_EXTENSIONS:pdf,csv,xlsx,xls,json,txt,png,jpg,jpeg}
file.max-size-bytes=${FILE_MAX_SIZE_BYTES:10485760}

# ─── Security Headers ─────────────────────────────────────────────────────────
# Handled in SecurityConfig via HeadersConfigurer — these comments serve as documentation
# X-Frame-Options: DENY
# X-Content-Type-Options: nosniff
# X-XSS-Protection: 0 (deprecated — CSP preferred)
# Strict-Transport-Security: max-age=31536000; includeSubDomains
# Content-Security-Policy: configured per environment
# Referrer-Policy: strict-origin-when-cross-origin

# ─── Session Management ───────────────────────────────────────────────────────
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=strict

# ─── Rate Limiting ────────────────────────────────────────────────────────────
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.login-max-attempts=${RATE_LIMIT_LOGIN_MAX:10}
app.rate-limit.login-window-seconds=${RATE_LIMIT_LOGIN_WINDOW:60}



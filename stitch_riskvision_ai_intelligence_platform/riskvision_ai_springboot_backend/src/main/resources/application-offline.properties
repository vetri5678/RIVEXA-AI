# ==============================================================================
# RiskVision AI — Spring Boot Offline Development Profile Configuration
# ==============================================================================
# This profile allows the application to start without database connectivity
# for basic testing and development of non-database features

# Basic server configuration
server.port=${PORT:8080}

# Disable database auto-configuration entirely
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Mock/minimal JWT configuration
jwt.secret=offline-development-secret-key-not-for-production-use-12345678901234567890123456789012
jwt.expire-length=1800000
jwt.refresh-expire-length=604800000

# Disable OAuth2 for offline mode
spring.security.oauth2.client.registration.google.client-id=offline-mode
spring.security.oauth2.client.registration.google.client-secret=offline-mode
spring.security.oauth2.client.registration.github.client-id=offline-mode
spring.security.oauth2.client.registration.github.client-secret=offline-mode

# CORS settings
spring.web.cors.allowed-origins=http://localhost:5176,http://127.0.0.1:5176

# Frontend base URL
app.frontend.url=http://localhost:5176

# ML Service URLs (still functional)
ml.service.url=http://localhost:8000

# Logging
logging.level.ai.riskvision.graveyard=INFO
logging.level.root=INFO

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
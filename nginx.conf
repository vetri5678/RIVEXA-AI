# HTTP Server - ACME Challenge & Automatic 301 Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rivexa.ai www.rivexa.ai dashboard.rivexa.ai;

    # Serve Let's Encrypt ACME Challenge for Certbot HTTP-01 validation
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server - SSL Termination & Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rivexa.ai www.rivexa.ai dashboard.rivexa.ai;

    # SSL Certificates (Let's Encrypt / Production Certs)
    ssl_certificate /etc/letsencrypt/live/rivexa.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rivexa.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Serve Frontend Static Files (Landing Page)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Serve React Dashboard Static Files (SPA Routing)
    location ^~ /dashboard {
        alias /usr/share/nginx/html/dashboard;
        try_files $uri $uri/ /dashboard/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Proxy FastAPI endpoints to FastAPI container (Port 8000)
    location ~ ^/api/v1/(dashboard|projects|reports|retraining|health|ready|pipeline|ml) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket connections (raw and SockJS STOMP) to Spring Boot Backend Gateway
    location ~ ^/(ws|ws-stomp)/ {
        proxy_pass http://springboot-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Default /api/ routes (auth, repositories, admin, audit-logs, github, profile) to Spring Boot Backend Gateway
    location /api/ {
        proxy_pass http://springboot-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 10;
    }

    # Proxy FastAPI OpenAPI Docs (dev only, remove in production)
    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/json application/javascript image/svg+xml;
}
